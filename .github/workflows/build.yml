name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore source tree
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import zipfile

          encoded_path = pathlib.Path('source-archive.zip.b64')
          raw = ''.join(encoded_path.read_text(encoding='utf-8').split())
          raw += '=' * (-len(raw) % 4)
          archive_path = pathlib.Path('source-archive.zip')
          archive_path.write_bytes(base64.b64decode(raw, validate=False))

          with zipfile.ZipFile(archive_path) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f'Corrupt ZIP member: {bad}')
              archive.extractall('.')

          source_root = pathlib.Path('fabric-towny')
          if not source_root.is_dir():
              raise RuntimeError('Expected fabric-towny directory was not extracted')
          PY
          test -f fabric-towny/build.gradle
          test -f fabric-towny/gradle.properties
          test -d fabric-towny/src/main/java

      - name: Apply Fabric 26.2 build fixes
        run: |
          sed -i "s/id 'fabric-loom'/id 'net.fabricmc.fabric-loom'/" fabric-towny/build.gradle
          sed -i 's/fabric_version=0.155.0+26.2/fabric_version=0.155.2+26.2/' fabric-towny/gradle.properties
          grep -q '^org.gradle.configuration-cache=' fabric-towny/gradle.properties || echo 'org.gradle.configuration-cache=false' >> fabric-towny/gradle.properties
          cat fabric-towny/build.gradle
          cat fabric-towny/gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle -p fabric-towny build --stacktrace --info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-towny-build
          path: |
            source-archive.zip.b64
            source-archive.zip
            fabric-towny/build/libs/*.jar
            fabric-towny/build/reports/**
          if-no-files-found: ignore
