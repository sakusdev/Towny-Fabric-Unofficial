name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore source tree
        run: |
          tar -xJf source-archive.tar.xz
          tar -xJf towny-patch-tests.tar.xz
          test -f fabric-towny/build.gradle
          test -f fabric-towny/gradle.properties
          test -d fabric-towny/src/main/java
          test -d fabric-towny/src/test/java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          gradle -p fabric-towny clean build --stacktrace --info 2>&1 | tee build.log

      - name: Dedicated server smoke test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p fabric-towny/run
          printf 'eula=true\n' > fabric-towny/run/eula.txt
          set +e
          timeout --signal=INT --kill-after=15s 120s \
            gradle -p fabric-towny runServer --stacktrace --info 2>&1 | tee server-smoke.log
          status=${PIPESTATUS[0]}
          set -e

          latest='fabric-towny/run/logs/latest.log'
          test -f "$latest"
          grep -Eiq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)|Dedicated server took|For help, type' "$latest"
          grep -Eiq 'fabric-towny|Fabric Towny|Towny' "$latest"

          # A timeout is expected because a healthy server keeps running.
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 130 ]; then
            exit "$status"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-towny-build
          path: |
            build.log
            server-smoke.log
            fabric-towny/run/logs/**
            fabric-towny/run/config/**
            fabric-towny/build/libs/*.jar
            fabric-towny/build/reports/**
            fabric-towny/build/test-results/**
          if-no-files-found: ignore
