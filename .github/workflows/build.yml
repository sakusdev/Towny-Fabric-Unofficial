name: normalize source tree

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ci-diagnostics
          fetch-depth: 0

      - name: Expand archives and commit normal project layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/towny-normalized
          mkdir -p /tmp/towny-normalized
          tar -xJf source-archive.tar.xz -C /tmp/towny-normalized
          tar -xJf towny-patch-tests.tar.xz -C /tmp/towny-normalized

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/towny-normalized/fabric-towny/src/main/java/dev/sakus/fabrictowny/protection/ProtectionHooks.java')
          text = path.read_text(encoding='utf-8')
          if 'UseItemCallback.EVENT.register' not in text:
              marker = '  UseBlockCallback.EVENT.register((p,w,h,hit)->{if(w.isClientSide()||!(p instanceof ServerPlayer sp))return InteractionResult.PASS;return check(e,sp,ClaimKey.of(sp.level(),hit.getBlockPos()),PermissionAction.SWITCH)?InteractionResult.PASS:InteractionResult.FAIL;});\n'
              callback = '  UseItemCallback.EVENT.register((p,w,h)->{if(w.isClientSide()||!(p instanceof ServerPlayer sp))return InteractionResult.PASS;return check(e,sp,ClaimKey.of(sp.level(),sp.blockPosition()),PermissionAction.ITEM_USE)?InteractionResult.PASS:InteractionResult.FAIL;});\n'
              if marker not in text:
                  raise SystemExit('UseBlockCallback marker not found')
              path.write_text(text.replace(marker, marker + callback), encoding='utf-8')
          PY

          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/towny-normalized/fabric-towny/ ./
          rm -f .github/workflows/normalize.yml
          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'WORKFLOW'
          name: build

          on:
            push:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '25'
                    cache: gradle
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '9.5.1'

                - name: Build and test
                  shell: bash
                  run: |
                    set -o pipefail
                    gradle clean build --stacktrace --info 2>&1 | tee build.log

                - name: Dedicated server smoke test
                  shell: bash
                  run: |
                    set -o pipefail
                    mkdir -p run
                    printf 'eula=true\n' > run/eula.txt
                    cat > run/server.properties <<'PROPERTIES'
                    online-mode=false
                    server-port=25565
                    level-name=world
                    max-players=1
                    view-distance=2
                    simulation-distance=2
                    sync-chunk-writes=true
                    PROPERTIES
                    set +e
                    timeout --signal=INT --kill-after=10s 45s gradle runServer --stacktrace --info 2>&1 | tee server-smoke.log
                    status=${PIPESTATUS[0]}
                    set -e
                    latest='run/logs/latest.log'
                    test -f "$latest"
                    test -f run/config/fabric-towny/config.json
                    test -f run/config/fabric-towny/data.json
                    grep -Eiq 'Done \([0-9.]+s\)!|For help, type' "$latest"
                    grep -Eiq 'Fabric Towny loaded: 0 towns, 0 nations, 0 blocks' "$latest"
                    ! grep -Eiq 'Failed to load properties|Crash report' "$latest"
                    python3 - <<'PY'
                    import json
                    from pathlib import Path
                    config=json.loads(Path('run/config/fabric-towny/config.json').read_text())
                    data=json.loads(Path('run/config/fabric-towny/data.json').read_text())
                    required={'townCreationCost','nationCreationCost','claimCost','outpostCost','baseTownBlocks','blocksPerResident','maxOutposts','inviteLifetimeMillis','newDayIntervalMillis','requireAdjacentClaims','allowFriendlyFire','wildernessBuild'}
                    missing=required-config.keys()
                    if missing: raise SystemExit(f'missing config keys: {sorted(missing)}')
                    if data.get('schemaVersion') != 3: raise SystemExit(f"unexpected schemaVersion: {data.get('schemaVersion')}")
                    if not isinstance(data.get('nextNewDayAt'),int) or data['nextNewDayAt'] <= 0: raise SystemExit('nextNewDayAt was not initialized')
                    PY
                    if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 130 ]; then exit "$status"; fi

                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: fabric-towny-build
                    path: |
                      build.log
                      server-smoke.log
                      run/logs/**
                      run/config/**
                      build/libs/*.jar
                      build/reports/**
                      build/test-results/**
                    if-no-files-found: ignore
          WORKFLOW

          cat > .gitignore <<'GITIGNORE'
          .gradle/
          build/
          run/
          out/
          *.log
          GITIGNORE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize repository source tree'
          git push origin HEAD:agent/ci-diagnostics
