name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore source tree
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import shutil
          import zipfile

          encoded_path = pathlib.Path('source-archive.zip.b64')
          raw = ''.join(encoded_path.read_text(encoding='utf-8').split())
          raw += '=' * (-len(raw) % 4)
          archive_path = pathlib.Path('source-archive.zip')
          archive_path.write_bytes(base64.b64decode(raw, validate=False))

          with zipfile.ZipFile(archive_path) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f'Corrupt ZIP member: {bad}')
              archive.extractall('.')

          source_root = pathlib.Path('fabric-towny')
          if not source_root.is_dir():
              raise RuntimeError('Expected fabric-towny directory was not extracted')

          for child in source_root.iterdir():
              destination = pathlib.Path(child.name)
              if child.is_dir():
                  shutil.copytree(child, destination, dirs_exist_ok=True)
              else:
                  shutil.copy2(child, destination)

          shutil.rmtree(source_root)
          archive_path.unlink(missing_ok=True)
          PY
          test -f build.gradle
          test -f gradle.properties
          test -d src/main/java

      - name: Apply Fabric 26.2 build fixes
        run: |
          sed -i "s/id 'fabric-loom'/id 'net.fabricmc.fabric-loom'/" build.gradle
          sed -i 's/fabric_version=0.155.0+26.2/fabric_version=0.155.2+26.2/' gradle.properties
          grep -q '^org.gradle.configuration-cache=' gradle.properties || echo 'org.gradle.configuration-cache=false' >> gradle.properties
          cat build.gradle
          cat gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --stacktrace --info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-towny-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: ignore
