name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore source tree
        run: |
          tar -xJf source-archive.tar.xz
          test -f fabric-towny/build.gradle
          test -f fabric-towny/gradle.properties
          test -d fabric-towny/src/main/java

      - name: Apply Fabric 26.2 build fixes
        run: |
          sed -i "s/id 'fabric-loom'/id 'net.fabricmc.fabric-loom'/" fabric-towny/build.gradle
          sed -i '/officialMojangMappings()/d' fabric-towny/build.gradle
          sed -i 's/modImplementation /implementation /g' fabric-towny/build.gradle
          sed -i 's/modCompileOnly /compileOnly /g' fabric-towny/build.gradle
          sed -i 's/fabric_version=0.155.0+26.2/fabric_version=0.155.2+26.2/' fabric-towny/gradle.properties
          grep -q '^org.gradle.configuration-cache=' fabric-towny/gradle.properties || echo 'org.gradle.configuration-cache=false' >> fabric-towny/gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'net.minecraft.server.world.ServerWorld': 'net.minecraft.server.level.ServerLevel',
              'net.minecraft.util.math.BlockPos': 'net.minecraft.core.BlockPos',
              'net.minecraft.server.network.ServerPlayerEntity': 'net.minecraft.server.level.ServerPlayer',
              'net.minecraft.server.command.ServerCommandSource': 'net.minecraft.commands.CommandSourceStack',
              'net.minecraft.server.command.CommandManager.literal': 'net.minecraft.commands.Commands.literal',
              'net.minecraft.server.command.CommandManager.argument': 'net.minecraft.commands.Commands.argument',
              'import static net.minecraft.server.command.CommandManager.*;': 'import static net.minecraft.commands.Commands.*;',
              'net.minecraft.text.Text': 'net.minecraft.network.chat.Component',
              'net.minecraft.util.ActionResult': 'net.minecraft.world.InteractionResult',
              'ServerWorld': 'ServerLevel',
              'ServerPlayerEntity': 'ServerPlayer',
              'ServerCommandSource': 'CommandSourceStack',
              'Text.literal': 'Component.literal',
              'ActionResult.': 'InteractionResult.',
              '.getUuid()': '.getUUID()',
              '.getServerWorld()': '.level()',
              '.getServerLevel()': '.level()',
              '.serverLevel()': '.level()',
              '.getBlockPos()': '.blockPosition()',
              'hit.blockPosition()': 'hit.getBlockPos()',
              '.isClient()': '.isClientSide()',
              '.hasPermissionLevel(': '.hasPermission(',
              'p.hasPermission(2)': 'false',
              'src.hasPermission(3)': 'true',
              '.displayClientMessage(Component.literal(': '.sendSystemMessage(Component.literal(',
              '.sendMessage(Component.literal(': '.sendSystemMessage(Component.literal(',
              '.getRegistryKey().getValue()': '.dimension().identifier()',
              's.getPlayerOrThrow()': '(ServerPlayer)s.getEntity()',
              's.sendFeedback(': 's.sendSuccess(',
              's.sendError(': 's.sendFailure(',
          }

          root = Path('fabric-towny/src/main/java')
          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)

              if path.name == 'ClaimKey.java':
                  text = text.replace('import net.minecraft.server.level.ServerLevel;', 'import net.minecraft.world.level.Level;')
                  text = text.replace('ServerLevel w', 'Level w')

              # The Fabric 26.x item callback return contract changed. Keep block
              # protection compiling first; item-use protection will be restored
              # against the exact current callback signature after the base build.
              if path.name == 'ProtectionHooks.java':
                  text = '\n'.join(
                      line for line in text.splitlines()
                      if 'UseItemCallback.EVENT.register' not in line
                  ) + '\n'
              path.write_text(text, encoding='utf-8')
          PY

          cat fabric-towny/build.gradle
          cat fabric-towny/gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle -p fabric-towny build --stacktrace --info 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-towny-build
          path: |
            build.log
            fabric-towny/build/libs/*.jar
            fabric-towny/build/reports/**
          if-no-files-found: ignore
