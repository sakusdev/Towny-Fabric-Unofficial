name: normalize source tree

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ci-diagnostics
          fetch-depth: 0

      - name: Expand archives
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/towny-normalized
          mkdir -p /tmp/towny-normalized
          tar -xJf source-archive.tar.xz -C /tmp/towny-normalized
          tar -xJf towny-patch-tests.tar.xz -C /tmp/towny-normalized
          test -f /tmp/towny-normalized/fabric-towny/build.gradle
          test -d /tmp/towny-normalized/fabric-towny/src/main/java
          test -d /tmp/towny-normalized/fabric-towny/src/test/java

      - name: Apply final Fabric 26.2 source patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/towny-normalized/fabric-towny/src/main/java/dev/sakus/fabrictowny/protection/ProtectionHooks.java')
          text = path.read_text(encoding='utf-8')
          if 'UseItemCallback.EVENT.register' not in text:
              marker = '  UseBlockCallback.EVENT.register((p,w,h,hit)->{if(w.isClientSide()||!(p instanceof ServerPlayer sp))return InteractionResult.PASS;return check(e,sp,ClaimKey.of(sp.level(),hit.getBlockPos()),PermissionAction.SWITCH)?InteractionResult.PASS:InteractionResult.FAIL;});\n'
              callback = '  UseItemCallback.EVENT.register((p,w,h)->{if(w.isClientSide()||!(p instanceof ServerPlayer sp))return InteractionResult.PASS;return check(e,sp,ClaimKey.of(sp.level(),sp.blockPosition()),PermissionAction.ITEM_USE)?InteractionResult.PASS:InteractionResult.FAIL;});\n'
              if marker not in text:
                  raise SystemExit('UseBlockCallback marker not found')
              path.write_text(text.replace(marker, marker + callback), encoding='utf-8')
          PY

      - name: Replace bootstrap files
        shell: bash
        run: |
          set -euxo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/towny-normalized/fabric-towny/ ./
          test -f build.gradle
          test -d src/main/java
          test -d src/test/java
          test ! -f source-archive.tar.xz
          test ! -f towny-patch-tests.tar.xz
          cat > .gitignore <<'GITIGNORE'
          .gradle/
          build/
          run/
          out/
          *.log
          GITIGNORE
          git status --short

      - name: Commit normalized project
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/build.yml' ':!.github/workflows/normalize.yml'
          git status --short
          git diff --cached --stat
          git commit -m 'Normalize repository source tree'
          git push origin HEAD:agent/ci-diagnostics
