name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore source tree
        run: |
          tar -xJf source-archive.tar.xz
          test -f fabric-towny/build.gradle
          test -f fabric-towny/gradle.properties
          test -d fabric-towny/src/main/java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle -p fabric-towny build --stacktrace --info 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-towny-build
          path: |
            build.log
            fabric-towny/build/libs/*.jar
            fabric-towny/build/reports/**
          if-no-files-found: ignore
